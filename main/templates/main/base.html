{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Інтернет-магазин{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <a href="{% url 'main:product_list' %}" class="logo">Магазин</a>
        <nav class="user-nav">
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:profile' %}">{{ user.username }}</a>
                {% if user.is_staff %}
                    <a href="{% url 'admin:index' %}">Адмін-панель</a>
                {% endif %}
                <a href="{% url 'accounts:logout' %}">Вийти</a>
            {% else %}
                <a href="{% url 'accounts:login' %}">Вхід</a>
                <a href="{% url 'accounts:register' %}" class="btn-auth">Реєстрація</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
    {% block content %}{% endblock %}
    </main>
</body>
</html>
